<VirtualHost *:80>
    ServerName climbsched.local
    DocumentRoot /var/www/climbsched/public

    <Directory /var/www/climbsched/public>
        AllowOverride All
        Require all granted
        Options Indexes FollowSymLinks
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/climbsched-error.log
    CustomLog ${APACHE_LOG_DIR}/climbsched-access.log combined
</VirtualHost>
