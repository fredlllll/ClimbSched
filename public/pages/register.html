<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Registrieren · ClimbSched</title><link rel="stylesheet" href="/styles.css"></head>
<body data-page="register"><main><h1>Registrierung</h1><p id="message"></p>
<form id="register-form">
<label>Name <input name="name" required></label>
<label>E-Mail <input type="email" name="email" required></label>
<label>Passwort <input type="password" name="password" minlength="8" required></label>
<button type="submit">Account erstellen</button>
</form>
<p><a href="/login">Zum Login</a></p></main><script type="module" src="/app.js"></script></body></html>
