<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ClimbSched</title><link rel="stylesheet" href="/styles.css"></head>
<body data-page="calendar"><header><h1>ClimbSched</h1><nav><a href="/verify-email">E-Mail</a><button id="logout-btn">Logout</button></nav></header>
<main>
<p id="message"></p>
<h2>Nächste 8 Tage (gestern + heute + 6 Tage)</h2>
<form id="event-form">
<label>Halle <input name="gym_name" required></label>
<label>Startzeit (lokal) <input type="datetime-local" name="starts_local" required></label>
<label>Notiz <textarea name="notes"></textarea></label>
<button type="submit">Termin erstellen</button>
</form>
<section><h3>Termine</h3><div id="events" class="events"></div></section>
</main>
<script type="module" src="/app.js"></script></body></html>
