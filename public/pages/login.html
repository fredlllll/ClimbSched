<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login · ClimbSched</title><link rel="stylesheet" href="/styles.css"></head>
<body data-page="login">
<main>
  <h1>ClimbSched Login</h1>
  <p id="message"></p>
  <form id="login-form">
    <label>E-Mail <input type="email" name="email" required></label>
    <label>Passwort <input type="password" name="password" required></label>
    <button type="submit">Einloggen</button>
  </form>
  <p><a href="/register">Registrieren</a> · <a href="/forgot-password">Passwort vergessen</a></p>
</main>
<script type="module" src="/app.js"></script>
</body></html>
